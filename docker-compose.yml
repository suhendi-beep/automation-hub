version: "3.9"

services:
  redis:
    image: redis:7-alpine
    restart: always
    networks: [hub-net]
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 128M

  backend:
    build: ./backend
    ports: ["5000:5000"]
    restart: always
    volumes:
      - ./shared:/app/shared
      - ./oci_config:/root/.oci:ro
    env_file: .env
    environment:
      - PYTHONPATH=/app
      - REDIS_URL=redis://redis:6379/0
    depends_on: [redis]
    networks: [hub-net]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M

  worker:
    build: ./backend
    command: celery -A celery_worker.celery worker --loglevel=info --concurrency=2
    restart: always
    volumes:
      - ./shared:/app/shared
      - ./oci_config:/root/.oci:ro
    env_file: .env
    environment:
      - PYTHONPATH=/app
      - REDIS_URL=redis://redis:6379/0
    depends_on: [redis]
    networks: [hub-net]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.2"
          memory: 256M

  frontend:
    build: ./frontend
    ports: ["3000:80"]
    restart: always
    depends_on: [backend]
    networks: [hub-net]
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M

networks:
  hub-net:
    driver: bridge
