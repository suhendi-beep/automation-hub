services:

  redis:
    image: redis:7-alpine
    restart: always
    expose: ["6379"]
    networks: [hub-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: 0.2
          memory: 128M
        reservations:
          cpus: 0.05
          memory: 32M

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-automation_hub}
      POSTGRES_USER: ${DB_USER:-automation}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      TZ: Asia/Jakarta
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [hub-net]
    shm_size: 128mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: 0.5
          memory: 512M
        reservations:
          cpus: 0.05
          memory: 128M

  migrate:
    build: ./backend
    command: alembic upgrade head
    restart: "no"
    env_file: .env
    environment:
      - PYTHONPATH=/app
      - TZ=Asia/Jakarta
    volumes:
      - ./shared:/app/shared
    networks: [hub-net]
    depends_on:
      db:
        condition: service_healthy

  backend:
    build: ./backend
    restart: always
    volumes:
      - ./shared:/app/shared
      - ./oci_config:/root/.oci:ro
    env_file: .env
    environment:
      - PYTHONPATH=/app
      - TZ=Asia/Jakarta
    expose: ["5000"]
    networks: [hub-net]
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/api/ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: 0.4
          memory: 384M
        reservations:
          cpus: 0.05
          memory: 96M

  worker:
    build: ./backend
    command: celery -A celery_worker.celery worker --loglevel=info --concurrency=1
    restart: always
    volumes:
      - ./shared:/app/shared
      - ./oci_config:/root/.oci:ro
    env_file: .env
    environment:
      - PYTHONPATH=/app
      - TZ=Asia/Jakarta
    networks: [hub-net]
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: 0.8
          memory: 896M
        reservations:
          cpus: 0.05
          memory: 128M

  beat:
    build: ./backend
    # Pidfile hidup di volume; tanpa rm, beat menolak start setelah container restart
    # karena pid lama (selalu 1) dianggap masih jalan.
    command: sh -c "rm -f /app/shared/celerybeat.pid && exec celery -A celery_worker.celery beat --loglevel=info --schedule=/app/shared/celerybeat-schedule --pidfile=/app/shared/celerybeat.pid"
    restart: always
    volumes:
      - ./shared:/app/shared
    env_file: .env
    environment:
      - PYTHONPATH=/app
      - TZ=Asia/Jakarta
    networks: [hub-net]
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: 0.1
          memory: 128M
        reservations:
          cpus: 0.02
          memory: 32M

  frontend:
    build: ./frontend
    ports: [3000:80]
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    networks: [hub-net]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: 0.2
          memory: 128M
        reservations:
          cpus: 0.02
          memory: 32M

networks:
  hub-net:
    driver: bridge

volumes:
  pgdata:
