services:

  redis:
    image: redis:7-alpine
    restart: always
    expose: ["6379"]
    networks: [hub-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: 0.2
          memory: 128M
        reservations:
          cpus: 0.05
          memory: 32M

  backend:
    build: ./backend
    restart: always
    volumes:
      - ./shared:/app/shared
      - ./oci_config:/root/.oci:ro
    env_file: .env
    environment:
      - PYTHONPATH=/app
      - TZ=Asia/Jakarta
    expose: ["5000"]
    networks: [hub-net]
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/api/ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: 0.4
          memory: 384M
        reservations:
          cpus: 0.05
          memory: 96M

  worker:
    build: ./backend
    command: celery -A celery_worker.celery worker --loglevel=info --concurrency=1
    restart: always
    volumes:
      - ./shared:/app/shared
      - ./oci_config:/root/.oci:ro
    env_file: .env
    environment:
      - PYTHONPATH=/app
      - TZ=Asia/Jakarta
    networks: [hub-net]
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: 0.8
          memory: 896M
        reservations:
          cpus: 0.05
          memory: 128M

  beat:
    build: ./backend
    command: celery -A celery_worker.celery beat --loglevel=info --schedule=/app/shared/celerybeat-schedule --pidfile=/app/shared/celerybeat.pid
    restart: always
    volumes:
      - ./shared:/app/shared
    env_file: .env
    environment:
      - PYTHONPATH=/app
      - TZ=Asia/Jakarta
    networks: [hub-net]
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: 0.1
          memory: 128M
        reservations:
          cpus: 0.02
          memory: 32M

  frontend:
    build: ./frontend
    ports: [3000:80]
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    networks: [hub-net]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: 0.2
          memory: 128M
        reservations:
          cpus: 0.02
          memory: 32M

networks:
  hub-net:
    driver: bridge
