services:

  backend:
    build: ./backend
    ports: ["5000:5000"]
    restart: always
    volumes:
      - ./shared:/app/shared
      - ./oci_config:/root/.oci:ro
    env_file: .env
    environment:
      - PYTHONPATH=/app
    networks: [hub-net]
    deploy:
      resources:
        limits:
          cpus: "0.4"
          memory: 384M
        reservations:
          cpus: "0.05"
          memory: 96M

  worker:
    build: ./backend
    command: celery -A celery_worker.celery worker --loglevel=info --concurrency=1
    restart: always
    volumes:
      - ./shared:/app/shared
      - ./oci_config:/root/.oci:ro
    env_file: .env
    environment:
      - PYTHONPATH=/app
    networks: [hub-net]
    deploy:
      resources:
        limits:
          cpus: "0.6"
          memory: 512M
        reservations:
          cpus: "0.05"
          memory: 128M

  frontend:
    build: ./frontend
    ports: ["3000:80"]
    restart: always
    depends_on: [backend]
    networks: [hub-net]
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 128M
        reservations:
          cpus: "0.02"
          memory: 32M

networks:
  hub-net:
    driver: bridge
